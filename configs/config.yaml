# Central config. src/ code should read from here, not hardcode values.
# This is also the "data contract" adhering to SmartTaxi backend requirements.

project:
  name: smart-eta-prediction
  stage: "2_modularization_and_scaffolding"

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  external_dir: data/external
  models_dir: models
  figures_dir: reports/figures
  mlruns_dir: mlruns

# --- Target Definitions ---
targets:
  primary: trip_duration
  trip_duration:
    description: "Passenger trip duration from pickup to dropoff"
    unit: "minutes"
    data_source: "nyc_tlc"
  driver_pickup:
    description: "Driver-to-passenger ETA until pickup arrival"
    unit: "minutes"
    data_source: "telemetry_dispatch_pending"
    fallback_strategy: "routing_engine_or_speed_heuristic"

# --- Prototyping dataset (NYC TLC Yellow Taxi) ---
dataset:
  name: nyc_tlc
  raw_subpath: nyc_tlc
  files:
    - yellow_tripdata_2025-01.parquet
    - yellow_tripdata_2025-04.parquet
    - yellow_tripdata_2025-07.parquet
    - yellow_tripdata_2025-10.parquet
  zone_lookup_file: taxi_zone_lookup.csv

  required_columns:
    pickup_datetime: tpep_pickup_datetime
    dropoff_datetime: tpep_dropoff_datetime
    pickup_location_id: PULocationID
    dropoff_location_id: DOLocationID
    trip_distance: trip_distance
    passenger_count: passenger_count

  target_column: trip_duration_seconds

  # Business thresholds & cleaning bounds
  trip_duration_bounds_seconds:
    min: 30             # drop trips shorter than 30s
    max: 14400          # drop trips longer than 4 hours

  trip_distance_bounds_miles:
    min: 0.1
    max: 100.0

# --- Market & Regional Calibration (Tunisian Deployment) ---
market:
  name: "tunisia"
  target_region: "Grand Tunis"
  currency: "TND"
  timezone: "Africa/Tunis"
  supported_governorates:
    - "Tunis"
    - "Ariana"
    - "Ben Arous"
    - "La Manouba"
  expansion_governorates:
    - "Sfax"
    - "Sousse"

  geographical_bounds:
    lat_min: 36.7500  # Sud Tunis / Ben Arous / Rades
    lat_max: 36.9150  # Ariana / Raoued / La Marsa / Gammarth
    lon_min: 10.1000  # Le Bardo / Manouba
    lon_max: 10.3400  # La Goulette / Carthage / La Marsa

  urban_speed_profiles_kmh:
    dense_downtown: 18.0     # Centre-Ville, Lafayette, Médina (congestion forte)
    standard_urban: 25.0     # Ennasr, Menzah, Bardo, Lac 1
    expressway: 55.0         # Voies rapides (Route de la Marsa, X20, GP8, Z4)
    highway: 80.0            # Autoroute A1 (Sud) / A4 (Bizerte)

  temporal_patterns:
    morning_peak_hours: [7, 8, 9]        # 07h30 - 09h00 (Bureaux & universités)
    lunch_peak_hours: [12, 13]           # 12h30 - 14h00 (Régime double séance)
    evening_peak_hours: [17, 18, 19]     # 17h00 - 19h00 (Sortie des bureaux)
    ramadan_pre_iftar_peak: [16, 17, 18] # Congestion extrême pré-rupture du jeûne
    rush_hour_speed_penalty_pct: 35.0    # Réduction de vitesse en pointe (-35%)

# --- SmartTaxi Backend Integration Rules ---
backend_rules:
  write_to_ride_table: false          # strictly read-only, NO direct DB writes
  authoritative_timestamp_source: backend
  simulate_traffic_if_missing: false  # do not silently impute traffic/weather
  simulate_weather_if_missing: false
  fallback_routing_speed_kmh: 25.0    # default urban speed for fallback calculation (Grand Tunis standard)
  fallback_rush_hour_speed_kmh: 18.0  # fallback speed during heavy rush hours
  fallback_expressway_speed_kmh: 55.0 # fallback speed for suburban/expressway routes

# --- Business Evaluation Thresholds ---
business_metrics:
  max_acceptable_mae_minutes: 3.5
  min_acceptable_r2: 0.60
  rush_hour_mae_tolerance_minutes: 4.5

# --- Modeling Settings ---
modeling:
  baseline:
    method: historical_avg_speed_x_distance
    segmentation: [global, hour, rush_hour]
  candidate_models:
    - random_forest
    - xgboost
    - lightgbm
    - catboost

split:
  strategy: time_based    # strictly time-based to prevent future leakage
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  random_seed: 42
